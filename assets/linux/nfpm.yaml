# Lunola Mova Linux packages: one description for the .deb and the .rpm.
#
# Built by build-app.yml with nfpm from the staged folder the AppImage is
# also made of, so every Linux bundle ships the same files. The program lives
# whole under /opt/lunola-mova - the binary finds its libraries in lib/ beside
# itself, by rpath, and nothing else on the system has to line up - with
# a launcher on the path, a desktop entry and an icon where the desktop
# looks for them. The version and architecture are handed in as
# environment; the files are named relative to the staged folder, which
# is where nfpm is run from:
#
#   cd stage/Lunola-Mova-0.2.7-linux-x86_64
#   VERSION=0.2.7 NFPM_ARCH=amd64 nfpm package -f ../../assets/linux/nfpm.yaml -p deb -t ..
name: lunola-mova
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: video
priority: optional
# Upstream recipe attribution: Concat contributors <jub0trd@gmail.com>.
# That upstream contact is not the fork distributor. Supply reviewed metadata.
# No fork homepage is asserted.
maintainer: ${LUNOLA_PACKAGE_MAINTAINER}
license: AGPL-3.0-or-later
description: |
  Free and open source video editor.
  Timeline editing, effects, transitions, titles, captions and speech,
  with FFmpeg underneath and hardware-accelerated preview and export.

contents:
  - src: lunola-mova
    dst: /opt/lunola-mova/lunola-mova
    file_info:
      mode: 0755
  - src: lib/*
    dst: /opt/lunola-mova/lib/
  - src: pkg/lunola-mova
    dst: /usr/bin/lunola-mova
    file_info:
      mode: 0755
  - src: pkg/app.lunola.mova.desktop
    dst: /usr/share/applications/app.lunola.mova.desktop
  - src: app.lunola.mova.png
    dst: /usr/share/icons/hicolor/256x256/apps/app.lunola.mova.png
  - src: LICENSE
    dst: /usr/share/doc/lunola-mova/LICENSE
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/lunola-mova/THIRD_PARTY_NOTICES.md

# What the binary loads from the system rather than from lib/: the
# toolkit the file dialogs use, sound, fonts and OpenGL. Named as each
# family names them.
overrides:
  deb:
    depends:
      - libc6
      - libgtk-3-0
      - libfontconfig1
      - libfreetype6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libgl1
      - libasound2 | libasound2t64
  rpm:
    depends:
      - gtk3
      - fontconfig
      - freetype
      - libxkbcommon
      - libxkbcommon-x11
      - mesa-libGL
      - alsa-lib
